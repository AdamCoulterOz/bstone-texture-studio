    <!-- The window-controls-overlay strips (the OS buttons, and Edge's own menu) are painted
         by the browser in the theme colour, so a single fixed value leaves them clashing with
         the title bar in one scheme or the other. Match --panel per scheme instead. These
         override the manifest's theme_color, and unlike it they apply on reload rather than
         needing a reinstall. -->
    <!-- Settled by experiment (2026-08-09): the overlay strips CANNOT be made transparent from
         a web page. "transparent" is a valid CSS colour so it is accepted rather than skipped,
         and Chromium then flattens the alpha — rgba(0,0,0,0) rendered as opaque black, giving
         black blocks at both ends of the bar. Transparency is real for
         CoreWebView2WindowControlsOverlay.BackgroundColor and UWP caption buttons, but those
         are native embedding APIs a PWA cannot reach. Do not try it again.

         Must match .wco .topbar's background (--panel2), not --panel: in overlay mode the bar
         is deliberately a shade off the content so the boundary reads without a hairline, and
         the strips have to be the same shade or they show as blocks at either end. -->
    <meta name="theme-color" content="#e9ebef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262a31" media="(prefers-color-scheme: dark)" />
