<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Texture Studio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="TextureStudio.App.styles.css" rel="stylesheet" />
    <!-- Icons: SVG for crisp tabs where supported, PNG for everything else, and the 180px
         apple-touch-icon for an iOS home-screen install. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The window-controls-overlay strips (the OS buttons, and Edge's own menu) are painted
         by the browser in the theme colour, so a single fixed value leaves them clashing with
         the title bar in one scheme or the other. Match --panel per scheme instead. These
         override the manifest's theme_color, and unlike it they apply on reload rather than
         needing a reinstall. -->
    <!-- Settled by experiment (2026-08-09): the overlay strips CANNOT be made transparent from
         a web page. "transparent" is a valid CSS colour so it is accepted rather than skipped,
         and Chromium then flattens the alpha — rgba(0,0,0,0) rendered as opaque black, giving
         black blocks at both ends of the bar. Transparency is real for
         CoreWebView2WindowControlsOverlay.BackgroundColor and UWP caption buttons, but those
         are native embedding APIs a PWA cannot reach. Do not try it again.

         Must match .wco .topbar's background (--panel2), not --panel: in overlay mode the bar
         is deliberately a shade off the content so the boundary reads without a hairline, and
         the strips have to be the same shade or they show as blocks at either end. -->
    <meta name="theme-color" content="#e9ebef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262a31" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Texture Studio" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/interop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
